name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.36-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.36
          NOTES=$'PageTurner v1.0.36（roothide 直装）—— 点击特征启用位移矢量匹配（区分同 sender 的双点击键）\n\n【v1.0.36 改了什么】\n1. 点击特征新增 tapDx（位移方向符号：向右/向左/原地）：会话按起点→终点 x 分量计算，录制页显示「位移：向右 0.4 pt」\n2. 点击匹配/去重启用位移判定：方向符号一致 + 位移区间（容差 0.15pt）——解决新 2 键翻页器（两键同 sender 0x1000786aa、位移仅 0.4/0.7 pt）第二键被误判「与已有方案高度相似」录不进的问题\n3. 正常录制与「增加特征」都保存点击位移；旧特征无 tapDx 自动按旧规则匹配（兼容不误伤）\n4. 特征列表与详情显示点击位移方向+大小\n\n【怎么测】\n1. 设置 → PageTurner → 记录与映射 → 学习：分别录新翻页器 0.4 键（右移）和 0.7 键（左移）两个方案，第二键不再被拒录\n2. 方案页测试：按 0.4 键命中方案 A、按 0.7 键命中方案 B，互不串\n3. 番茄小说实测：两个键各自触发各自映射、原翻页器动作被吞\n4. 有问题把 /var/mobile/Documents/PageTurner.log 发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.27" --notes "$NOTES"
          fi
