name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.33-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.33
          NOTES=$'PageTurner v1.0.33（roothide 直装）—— 测试区滑动速度修复 + 命中日志加特征\n\n【v1.0.33 改了什么】\n1. 测试区滑动速度 bug：旧代码把 speed 当毫秒时长（固定=速度值毫秒，与滑动距离无关）——距离 200pt 也固定 1 秒，而运行端按真实速度换算只要 0.2s，所以体感"测试区很慢、App 很快"。现在测试区与运行端统一：时长=距离/速度，两边速度一致\n2. 测试区命中日志加特征细节：✓ 命中「右键」→ 映射 N 条动作（sender=… phase=… dir=… dist=…），与未命中格式一致\n\n【怎么测】\n1. 装 v1.0.33 → 注销\n2. 方案页长按滑动动作设速度 → 测试本方案：滑动速度应与 App 内一致\n3. 有问题把 /var/mobile/Documents/PageTurner.log 发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.27" --notes "$NOTES"
          fi
