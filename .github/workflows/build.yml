name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.18-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.18
          NOTES=$'PageTurner v1.0.18（roothide 直装）—— 运行端双通道，修复映射执行不到\n\n【v1.0.18 改了什么】\n1. 运行端双通道：\n   - 方向键 = addEvent 层读 HID 相对位移（0x23/0x24）匹配（sender+方向±15°，跳过 dist 区间：HID 计数与 UITouch pt 量级不同），命中即吞事件 + 执行映射动作，App 不再收到翻页器滚动\n   - 点击键 = sendEvent 层 UITouch 会话匹配（真实 v1.0.4 原链路）\n2. 执行端不变 = PTFakeMetaTouch（与 volumekeytapper 同源 KIF 合成触摸，已验证可点触）\n3. 学习采集端 = 真实 v1.0.4 逐字未动（多键可录、有位移）\n4. App 进程日志全打：[addEvent] 方向键/点击键分流、[HID] 位移累计与结算、[执行] 命中序列\n\n【怎么测（重点）】\n1. 装 v1.0.18 → 注销\n2. 设置 → PageTurner → 指定 App 生效 → 勾选目标 App（如番茄小说）\n3. 打开目标 App → 按翻页器你录过特征的键 → 看是否执行映射动作（点击/双击/滑动）\n4. 若未执行：把 App 容器 Documents/PageTurner.log 完整发我（路径 /var/mobile/Containers/Data/Application/<App>/Documents/PageTurner.log，或 Filza 里搜 PageTurner.log）\n5. 日志关键段：[addEvent] 是否分流 → [HID] 结算 dir 是否在 ±15° → [执行] 是否命中'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.18" --notes "$NOTES"
          fi
