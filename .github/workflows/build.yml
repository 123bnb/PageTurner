name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.35-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.35
          NOTES=$'PageTurner v1.0.35（roothide 直装）—— 设置页风格统一（灰分组背景 + 方案名白卡片）\n\n【v1.0.35 改了什么】\n1. 记录与映射往里的页面（方案列表/方案页/特征列表/App列表/防抖/动作设置/调试日志）背景从纯白改成系统灰分组背景，与插件主设置页一致；列表行变白底卡片（系统设置风格）\n2. 方案页方案名：改成白底圆角卡片样式（像输入框），点它弹框改名\n3. 学习页/测试页保留大白屏（录特征/看轨迹需要干净背景）\n4. 方案页蓝/橙大按钮保留（醒目）\n\n【怎么测】\n1. 装 v1.0.35 → 注销 → 设置 → PageTurner → 记录与映射各页面：背景应为灰色分组风格，方案名是白卡片\n2. 有问题把 /var/mobile/Documents/PageTurner.log 发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.27" --notes "$NOTES"
          fi
