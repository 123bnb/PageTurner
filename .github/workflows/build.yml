name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.10-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.10
          NOTES=$'PageTurner v1.0.10（roothide 直装）—— 录制端真正回滚 v1.0.4 原版\n\n【v1.0.10 改了什么（核心）】\n上一版（v1.0.9）只是删了锚定，录制采集层仍是 v1.0.8 的 sendEvent 坐标版，在设置 App 里收不到翻页器 → 还是录不了。这版把录制代码【整段还原成 v1.0.4 原版】：\n1. 【录制】hook _UIUpdateHIDDigitizerInput -addEvent:，type=11 全收（无过滤、无锚定），读 IOHIDEvent 相对位移 0x23/0x24 —— 用户实测唯一能正常录翻页器的版本\n2. 【学习页】恢复 v1.0.4 的"进入即开始录制"（去掉 v1.0.7 的 1 秒延迟）\n3. 【轨迹】保留：每按一次键屏幕画出相对位移路径——起点绿圈（屏幕中心）、沿线绿点、终点红点、蓝色位移线，底部标注 Δ(x,y)\n4. 【日志】自动建目录修复保留\n\n【怎么测】\n1. 装 v1.0.10 → 注销\n2. 设置 → PageTurner → 新建方案 → 新增记录\n3. 直接按翻页器键（手指勿碰屏幕）→ 应正常录制 + 屏幕出现轨迹\n4. 录完映射 → 开调试模式 → 打开生效 App → 按学过的键 → 绿大圆点=映射动作落点\n5. 有问题把 /var/mobile/Documents/PageTurner.log 发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release delete "$TAG" --yes || true
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.10" --notes "$NOTES"
          fi
