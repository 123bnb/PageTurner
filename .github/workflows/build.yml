name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.2-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.2
          NOTES=$'PageTurner v1.0.2（roothide 直装）—— 修复设置页条目不显示\n\n【v1.0.2 修复了什么】\n1. 设置里看不到 PageTurner 条目：PreferenceLoader 入口 plist 缺少 detail=RootListController 和 isController=true，PreferenceLoader 不认这是控制器入口 → 已补齐（对照已验证能显示的 HIDEventSniffer 入口格式）\n2. Makefile before-package 手动把入口 plist 装进 staging，双保险\n\n【功能（同 v1.0.1）】\n1. 所有 UI 在系统设置 → PageTurner：方案列表（左滑删除）/ 新增方案 / 方案页（名称/记录/映射区）/ 学习页（大白屏录特征）/ 绿点动作设置。App 内零 UI\n2. sender 录进特征（不写死设备），学习宿主 = Preferences 进程\n3. 特征判定：下限 5 次 + 方向一致 + 位移收敛，上限 15 次；高度相似拒绝\n4. 映射：点击/双击/滑动（绿点①②+速度）/延迟/静音/音量±；一次按键顺序全执行，执行中再按=中断\n\n【怎么测】\n1. 装 v1.0.2 → 注销\n2. 设置往下翻 → 能看到 PageTurner 条目\n3. 开总开关 → 勾选生效 App → 记录与映射 → 新增方案 → 新增记录 → 大白屏反复按翻页器同一键 → 命名 → 新增映射 → 打开生效 App 验证'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.2" --notes "$NOTES"
          fi
