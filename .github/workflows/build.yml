name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.13-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.13
          NOTES=$'PageTurner v1.0.13（roothide 直装）—— 录制日志内存+文件双写（日志页 100% 可见）+ 冲突提示自动换行\n\n【v1.0.13 改了什么】\n1. 【日志双写】日志改为①内存数组（日志页直接显示，不依赖文件系统，绝不会空白）+ ②文件多候选路径（沙盒 Documents → home/Documents → tmp → /var/mobile/Documents，第一个可写的生效并显示实际路径）\n2. 【提示换行】录制页状态提示改为大高度+自动换行，冲突提示长文字碰屏幕边缘自动换行，不再显示不全\n3. 录制逻辑仍是 v1.0.4 原版（addEvent 0x23/0x24，无过滤无锚定），没动\n\n【怎么测】\n1. 装 v1.0.13 → 注销 → 重开设置\n2. 设置 → PageTurner → 日志（应显示"日志路径: ..."）\n3. 新建方案 → 新增记录 → 连按同一个键直到稳定 → 返回\n4. 再新增记录录第二个键 → 提示重复也没关系 → 返回\n5. 回 设置 → PageTurner → 日志 → 复制，把内容完整发我（这次一定有内容：每个键的 sender/dx/dy/phase/dir/dist 全会打出来）'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release delete "$TAG" --yes || true
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.13" --notes "$NOTES"
          fi
