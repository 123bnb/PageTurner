name: Build PageTurner

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 约束：同一版本（git ref / tag）同时只能有一个构建在跑；
# 同版本再次触发会取消较早的运行，保证“一个版本一个 Actions”。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45   # 注：GitHub 超时最小单位为 1 分钟；本构建需数分钟，设 45 兜底（deb + dylib 两包）
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      # ---------- roothide deb ----------
      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "DEB_RAW=$DEB" >> "$GITHUB_ENV"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      # ---------- TrollStore / 巨魔 dylib（纯 clang + ldid，无 theos / 无 Logos / 无 ellekit） ----------
      - name: Build TrollStore dylib
        run: |
          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          mkdir -p out
          # 统一引擎 common/PTEngine.m + dylib 薄壳 targets/dylib/* + ptftouch
          SRCS="common/PTEngine.m targets/dylib/PTDylibMain.m targets/dylib/PTDylibUI.m \
                ptftouch/PTFakeMetaTouch.m ptftouch/UITouch-KIFAdditions.m \
                ptftouch/UIEvent+KIFAdditions.m ptftouch/IOHIDEvent+KIF.m"
          # 打 tag(v*) 用 tag 名，普通 push 用 dev-<短sha>
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then VER="${GITHUB_REF_NAME}"; else VER="dev-${GITHUB_SHA:0:7}"; fi
          OUT="out/PageTurnerDylib_${VER}.dylib"
          echo "DYLIB_OUT=$OUT" >> "$GITHUB_ENV"
          echo "输出产物: ${OUT}"
          # 先试 arm64+arm64e；arm64e 若失败则只 arm64
          clang -arch arm64 -arch arm64e -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -fobjc-arc -fobjc-abi-version=2 \
            -Wl,-undefined,dynamic_lookup \
            -Wno-unused-variable -Wno-deprecated-declarations -Wno-arc-performSelector-leaks -Wno-unused-function \
            -Icommon -Iptftouch -include ptftouch/Compat.h \
            -framework Foundation -framework UIKit \
            -dynamiclib $SRCS -o "$OUT" \
            && echo "编译 OK (arm64+arm64e)" \
            || { echo "arm64+arm64e 失败, 尝试只 arm64"; \
                 clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                   -fobjc-arc -fobjc-abi-version=2 \
                   -Wl,-undefined,dynamic_lookup \
                   -Wno-unused-variable -Wno-deprecated-declarations -Wno-arc-performSelector-leaks -Wno-unused-function \
                   -Icommon -Iptftouch -include ptftouch/Compat.h \
                   -framework Foundation -framework UIKit \
                   -dynamiclib $SRCS -o "$OUT" \
                   && echo "编译 OK (仅arm64)"; }
          file "$OUT"
          ldid -S "$OUT" && echo "ldid 签名 OK"

      # ---------- 发布 Release（仅 tag，版本号取自 tag） ----------
      - name: Publish Release (tag only, version from tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DEB_RAW="${{ env.DEB_RAW }}"
          DEB="PageTurner-${VERSION}-roothide.deb"
          cp "$DEB_RAW" "$DEB"
          DYLIB_RAW="${{ env.DYLIB_OUT }}"
          DYLIB="PageTurnerDylib_${TAG}.dylib"
          cp "$DYLIB_RAW" "$DYLIB"
          NOTES=$'PageTurner v'"${VERSION}"$'（统一代码：roothide 直装 .deb + 巨魔注入 .dylib）\n\n功能与 v1.0.56 完全一致（学习模式 + 映射 + 动作执行 + 设置页），仅代码统一为单仓库单构建；删除已失效的注入探针开关。\n\n安装方式：\n· 越狱(roothide)：装 PageTurner-'"${VERSION}"$'-roothide.deb，系统设置→PageTurner 里开总开关并勾选生效 App\n· 巨魔(TrollStore / TrollFools)：用注入器把 PageTurnerDylib_'"${TAG}"$'.dylib 注入目标 App，App 内三指长按弹菜单'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" "$DYLIB" --clobber
          else
            gh release create "$TAG" "$DEB" "$DYLIB" --title "PageTurner v${VERSION}" --notes "$NOTES"
          fi
