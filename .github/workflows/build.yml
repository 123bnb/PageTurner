name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.29-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.29
          NOTES=$'PageTurner v1.0.29（roothide 直装）—— 8项：学习页保存 + 拦截修复 + 日志落盘\n\n【v1.0.29 改了什么】\n1. 学习页：特征稳定后不再弹框——背景变绿提示，右上角「保存」自己点；默认名「新方案N」，名字以后在方案页改；保存后直接回列表\n2. 方案页返回即刷新：新增映射/修改后回方案页立即显示\n3. 学习页/测试页轨迹换成调试可视化同款（起点绿点+方向线+P标记）\n4. 新增【注入探针】独立开关：探针弹窗+提醒条归它管，与调试可视化互相独立\n5. 点击方案页动作行可编辑：预填原坐标，完成覆盖更新（保留时序参数）\n6. 拦截修复（核心）：已学 sender 会话无视映射执行中的 gIsInjecting 继续吞+执行——修双动作和卡顿\n7. 日志落盘修复：运行端 PageTurner.log 自动创建（之前一直静默丢失，这就是你找不到文件的原因），现在 /var/mobile/Documents/PageTurner.log 必有日志\n8. 注入标记加 jbroot 兜底\n\n【怎么测】\n1. 装 v1.0.29 → 注销\n2. 打开番茄小说（勾选生效）→ 若开了探针可见探针/提醒条\n3. 按翻页器键 → 看是否只有映射动作、原始滑动消失\n4. 实测后把 /var/mobile/Documents/PageTurner.log 发我（这次必有）'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.27" --notes "$NOTES"
          fi
