name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.26-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.26
          NOTES=$'PageTurner v1.0.26（roothide 直装）—— 总开关=总闸：探针/提醒条/调试可视化全纳入\n\n【v1.0.26 改了什么】\n1. 总开关接管一切：关闭总开关 → 注入探针不再弹、提醒条不显示、调试可视化不画、拦截不生效（之前探针是独立的，只要注入成功任何第三方 App 都弹）\n2. 调试可视化纳入总开关：总开关关掉后即使 debugDots 开着也不画\n\n【怎么测】\n1. 装 v1.0.26 → 注销\n2. 总开关开：打开番茄 → 2.5s 弹探针；勾选的 App 有黄边框提醒条；开调试可视化按翻页器有绿点\n3. 总开关关：以上全部消失，插件完全静默\n\n（v1.0.25 已修跨沙盒配置读写：设置页同时写 jbroot 路径，App 侧读得到）'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.26" --notes "$NOTES"
          fi
