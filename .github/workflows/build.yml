name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.8-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.8
          NOTES=$'PageTurner v1.0.8（roothide 直装）—— 拦截架构回滚到 sendEvent 层，修复方向键完全没拦\n\n【v1.0.8 改了什么（核心）】\n1. 【拦截回滚】v1.0.5 把拦截搬到 _UIUpdateHIDDigitizerInput -addEvent: 读 0x23/0x24 字段，实测是错的：翻页器方向键在 addEvent 层根本不是 type=11，点击键 type=11 但 0x23/0x24 读出全 0 → 方向键完全没拦、位移全废 → 录制失败/运行失败/调试没绿点。回滚到 v1.0.4 验证过的方案：hook UIApplication -sendEvent:，从合成触摸的 _hidEvent 溯源 sender（手指触摸 sender=0 天然排除、翻页器≠0），从 UITouch 屏幕坐标提取位移/方向（和画布实测一致的真实数据）\n2. 【录制】录制端同架构：只录翻页器设备（sender≠0 锚定），手指滑动自动排除，位移/方向用真实合成坐标\n3. 【调试模式】开启后所有点触可视化：注入的模拟点触=绿色大圆点、翻页器合成触摸=绿色大圆点、手指=蓝色小圆点（0.6 秒消失，独立窗口不挡触摸）。按翻页器键立刻看到绿点=映射动作位置\n4. 点击/双击/滑动注入补 senderID（v1.0.6 保留）\n\n【怎么测（重点）】\n1. 装 v1.0.8 → 注销\n2. 设置 → PageTurner → 确认图标大小正常\n3. 新建方案 → 新增记录 → 只按翻页器键（手指勿碰屏幕）→ 应正常录制（计数上涨、显示方向/位移）\n4. 开调试模式 → 打开生效 App → 按学过的键 → 屏幕出现绿色大圆点 = 映射动作位置；同时确认映射动作（点击/滑动）真的生效\n5. 有问题把 /var/mobile/Documents/PageTurner.log 发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release delete "$TAG" --yes || true
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.8" --notes "$NOTES"
          fi
