name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.4-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.4
          NOTES=$'PageTurner v1.0.4（roothide 直装）—— 设置条目加图标\n\n【v1.0.4 改了什么】\n1. 设置 App 里 PageTurner 条目现在有图标：深蓝渐变圆角 + 白色翻页箭头（icon.png 打包进 bundle，入口 plist 加 icon key）\n\n【功能（同 v1.0.3）】\n1. 首页只剩：总开关 / 指定 App 生效 / 防抖间隔 / 记录与映射\n2. 方案页：新增记录蓝底白字大按钮 + 新增映射蓝色高亮\n3. 学习收集由设置页 bundle 内自 hook（绕开 roothide 不注入系统 App 的问题）\n4. 学习页 1.5 秒无事件 → 橙色诊断提示\n\n【怎么测】\n1. 装 v1.0.4 → 注销\n2. 设置 → 看到带图标的 PageTurner 条目'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.4" --notes "$NOTES"
          fi
