name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.38-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.38
          NOTES=$'PageTurner v1.0.38（roothide 直装）—— 修复新增映射覆盖已有映射的 bug\n\n【v1.0.38 改了什么】\n1. 修复严重 bug：新增映射会覆盖已有第 1 条映射，导致无论新增多少次都只剩 1 条\n   - 根因：新增入口未初始化 editIndex（默认 0），保存逻辑把 editIndex=0 当成\u201c编辑第 0 条\u201d走覆盖分支\n   - 修复：新增入口显式 editIndex=-1；保存逻辑加 editAction 条件双保险（只有编辑模式才覆盖，新增一律追加）\n2. 影响说明：此前被覆盖的旧映射已丢失无法找回，需重新添加\n\n【怎么测】\n1. 方案页 → ＋ 新增记录 → 添加点击/双击/滑动 → 完成\n2. 连续新增 3 条不同映射 → 返回方案页：应显示 3 条，逐条存在不覆盖\n3. 点击已有动作行 → 修改坐标 → 完成：该条被更新、其余条不动\n4. 番茄小说实测正常'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.38" --notes "$NOTES"
          fi
