name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.41-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.41
          NOTES=$'PageTurner v1.0.41（roothide 直装）—— 狂按根因修复 + 固定 60fps + 防惯性开关\n\n【v1.0.41 改了什么】\n1. 狂按修复（根因实锤）：滑动 Began 延迟 40ms\n   - 之前：新滑动的 Began 立即发出，旧滑动被弃置后的 Ended 稍后才补发\n     → 迟到的 Ended 把刚 Began 的新触摸掐死 → 连按滑动残缺、越按越短\n   - 现在：旧复位的 Ended 先发完（≤16ms），新触摸才 Began → 每次按键完整执行\n2. 固定 16ms 一帧（60fps 采样）\n   - 之前：帧间隔随\"滑动分段\"变大（12 段高速滑动 = 62ms/帧），主线程一抖\n     轨迹点间距忽大忽小 → 视觉速度不均匀\n   - 现在：位置仍按真实时间插值，固定 16ms 采样 → 轨迹点密且间距均匀\n3. 【防惯性】显式开关（滑动参数页，默认开）\n   - 开（默认）：滑到终点每帧不动（静止衰减 300ms+）→ 弹起无惯性\n   - 关：干净利落（停弹起停留后直接弹起，有轻微惯性，自己权衡）\n   - 回滑距离/回滑停顿两参数已删除（由开关统一管理）\n\n【怎么测】\n1. 设置→滑动参数页：确认【防惯性】开关默认开；关掉后滑动明显干脆（可能有惯性）\n2. 番茄小说快速连按 5~10 次：每次都翻页、距离完整，不再越按越短、不再残缺\n3. 速度 2000 滑动：轨迹均匀、停在目标位不惯性前滑\n4. 有问题把 /var/mobile/Documents/PageTurner.log 发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.41" --notes "$NOTES"
          fi
