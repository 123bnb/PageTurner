name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.25-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.25
          NOTES=$'PageTurner v1.0.25（roothide 直装）—— 跨沙盒配置读写双通：注入通了、配置也通了\n\n【v1.0.25 改了什么】\n1. 根因修复（跨沙盒配置读取的最后一环）：设置页之前只写普通路径 /var/mobile/Library/Preferences/com.yourname.pageturner.plist，第三方 App 沙盒读该路径会被系统重定向到 App 自己容器 → 永远读不到 → 探针显示"全局配置：文件不可读"、勾选App数=0、本App被勾选=否\n2. 设置页写入改为照抄注入端 PTJbrootRoot 的 dyld 镜像遍历：从 .jbroot-XXX 根拼 jbroot 真实偏好路径写入 + 普通路径兜底，App 侧 PTGlobalPlistPath 多候选读取必有一处命中\n3. 探针现在应显示：全局配置：文件可读 /private/var/containers/Bundle/Application/.jbroot-XXX/var/mobile/Library/Preferences/com.yourname.pageturner.plist，总开关/勾选App数/本App被勾选全部真实\n\n【怎么测】\n1. 装 v1.0.25 → 注销\n2. 设置 → PageTurner → 打开总开关、勾选番茄小说\n3. 打开番茄小说 → 2.5 秒弹探针：\n   - 全局配置：文件可读（jbroot 路径）\n   - 总开关 enabled：开\n   - 勾选 App 数：1，本App被勾选：是\n4. 按翻页器按键 → 应该执行映射动作（点触可视化开 → 看到绿点）\n\n（v1.0.23 已修 Filter 空{} 注入问题；v1.0.25 补齐配置读写两侧）'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.25" --notes "$NOTES"
          fi
