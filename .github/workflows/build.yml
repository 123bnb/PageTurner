name: Build PageTurner

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 约束：同一版本（git ref / tag）同时只能有一个构建在跑；
# 同版本再次触发会取消较早的运行，保证“一个版本一个 Actions”。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45   # 注：GitHub 超时最小单位为 1 分钟；本构建需数分钟，设 45 兜底（deb + dylib 两包）
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PTVersion.h 是 .gitignore 生成物（版本横幅宏真源），编译前必须存在：
      # deb 走 make（before-all 会生成），巨魔 dylib 走裸 clang 不过 make 钩子，
      # 故这里在 checkout 后统一生成一次，两个构建都受益。
      - name: Generate PTVersion.h (from PACKAGE_VERSION)
        run: bash scripts/gen_ptversion.sh

      - name: Verify version consistency (control / Info.plist / Makefile / PTVersion.h)
        run: bash scripts/check_version.sh

      # ---------- 源码覆盖审计：每个 tracked .m 都必须登记进某个目标组合 ----------
      # build/sources.mk 是三目标文件列表的单一真源；漏登记 = 该文件被静默漏编译
      # （不报链接错、直接丢功能）。用 git ls-files 与 print-all-sources 对账，漏一个即失败。
      # v1.0.78：排除 tests/——tests/PTCoreLogicTests.m 是 CLI 测试 harness（main()，
      # 只链 PTCoreLogic.m），不进 theos 三目标，由下面的「Run PTCoreLogic tests」
      # 单独编译执行。它若混进 sources.mk 反而会被编进 tweak/dylib，撞 main 重定义。
      - name: Audit source coverage (every tracked .m registered in sources.mk)
        run: |
          git ls-files '*.m' | grep -v '^tests/' | sort > /tmp/tracked_m.txt
          make -s -f build/sources.mk PRINT_CONFIG=1 print-all-sources | tr ' ' '\n' | sort -u > /tmp/registered_m.txt
          echo "===== tracked .m ($(wc -l < /tmp/tracked_m.txt) 个，已排除 tests/) ====="
          cat /tmp/tracked_m.txt
          echo "===== registered .m ($(wc -l < /tmp/registered_m.txt) 个) ====="
          cat /tmp/registered_m.txt
          MISSING=$(comm -23 /tmp/tracked_m.txt /tmp/registered_m.txt || true)
          if [ -n "${MISSING}" ]; then
            echo "::error::以下 .m 未登记进 build/sources.mk 任何目标组合（会被静默漏编译）："
            echo "${MISSING}"
            exit 1
          fi
          echo "OK: 所有 tracked .m 均已登记"

      # ---------- 语法/import 静态校验（clone Theos 之前，fail fast） ----------
      # v1.0.78（评审 #2）：v1.0.77 连炸 5 轮 CI 的根因 = 括号平衡 / import 链
      # 只有「人肉 + 等编译」一道关，而 dylib 走裸 clang、本地不可编 → 每轮修复
      # 都要付一次 clone Theos + 全量编译的时间成本。这两个脚本把该关前移到
      # clone Theos 之前：纯文本分析，秒级完成，语法级/链接级问题立刻失败。
      - name: Check bracket balance (syntax guard, pre-Theos)
        run: bash scripts/check_syntax.sh

      - name: Check import chain (link guard, pre-Theos)
        run: bash scripts/check_imports.sh

      # v1.0.79-fix1：deb 装机实测「记录与映射」白屏——PTUIPlansVC 建了 table
      # 却漏设 dataSource/delegate（v1.0.71 收敛共享 VC 时漏行）。这类装配
      # 疏漏编译期零暴露、运行期白屏，用文本级检查兜住：建了 self.tv 的
      # 共享列表页必须设置 dataSource/delegate（基类除外，其数据源归子类）。
      - name: Check shared table wiring (dataSource/delegate guard)
        run: bash scripts/check_table_wiring.sh

      # v1.0.80：深色模式色彩安全门禁。系统深色模式会把容器背景变暗，
      # UI 层写死白/黑/灰背景或文字色 → 暗底白块糊成一片/暗底黑字不可读，
      # 浅色模式下肉眼完全正常、只有用户开深色模式才炸（与白屏同类：
      # 装配疏漏编译期零暴露）。禁背景写死、禁文字写死黑灰（彩色底白字
      # 放行——白字只出现在彩色底上，两模式均可读）；直写彩色必须包
      # colorWithDynamicProvider 按深浅分支。
      - name: Check dark mode color safety
        run: bash scripts/check_darkmode.sh

      # ---------- PTCoreLogic 纯逻辑测试（clone Theos 之前，秒级） ----------
      # v1.0.78（评审 #6）：引擎六个实现文件都 import UIKit，macOS 上编不了 →
      # CI 原本零单测。v1.0.78 把零 UI 依赖的纯逻辑下沉 common/PTCoreLogic.{h,m}
      # （Foundation/CoreGraphics-only），tests/PTCoreLogicTests.m 以 CLI harness
      # （main() + CHECK）只链它——macos-latest 上 clang 原生编译执行，84 条断言。
      # 放在 clone Theos 之前：纯逻辑回归秒级失败，不付全量编译的时间成本。
      - name: Run PTCoreLogic tests (pure-logic, pre-Theos)
        run: bash tests/run.sh

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      # ---------- roothide deb ----------
      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "DEB_RAW=$DEB" >> "$GITHUB_ENV"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      # ---------- TrollStore / 巨魔 dylib（纯 clang + ldid，无 theos / 无 Logos / 无 ellekit） ----------
      - name: Build TrollStore dylib
        run: |
          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          mkdir -p out
          # v1.0.71：dylib 目标源文件列表 + 共享编译 flags 全部从 build/sources.mk 单一真源读取。
          # 此前此处手拼「SHARED_SRCS + PTOverlayPage.m + dylib 薄壳」，与根 Makefile 两处维护。
          # v1.0.78：再并上 dylib 专属 flags（-Os + 分区 + -dead_strip，体积回补）——本地
          # 一键构建 scripts/build_dylib.sh 与这里读同一组变量，两条路永不漂移。
          SRCS=$(make -s -f build/sources.mk PRINT_CONFIG=1 print-dylib-sources)
          SHARED_CFLAGS=$(make -s -f build/sources.mk PRINT_CONFIG=1 print-cflags)
          DYLIB_CFLAGS=$(make -s -f build/sources.mk PRINT_CONFIG=1 print-dylib-cflags)
          DYLIB_LDFLAGS=$(make -s -f build/sources.mk PRINT_CONFIG=1 print-dylib-ldflags)
          echo "dylib 源文件: ${SRCS}"
          echo "共享 flags : ${SHARED_CFLAGS}"
          echo "dylib flags: ${DYLIB_CFLAGS} / ${DYLIB_LDFLAGS}"
          # 打 tag(v*) 用 tag 名，普通 push 用 dev-<短sha>
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then VER="${GITHUB_REF_NAME}"; else VER="dev-${GITHUB_SHA:0:7}"; fi
          OUT="out/PageTurnerDylib_${VER}.dylib"
          echo "DYLIB_OUT=$OUT" >> "$GITHUB_ENV"
          echo "输出产物: ${OUT}"
          # 先试 arm64+arm64e；arm64e 若失败则只 arm64
          clang -arch arm64 -arch arm64e -isysroot "$SDK" -miphoneos-version-min=15.0 \
            ${SHARED_CFLAGS} ${DYLIB_CFLAGS} \
            -Wl,-undefined,dynamic_lookup ${DYLIB_LDFLAGS} \
            -framework Foundation -framework UIKit \
            -dynamiclib $SRCS -o "$OUT" \
            && { strip -x "$OUT" && echo "strip OK"; } \
            && echo "编译 OK (arm64+arm64e)" \
            || { echo "arm64+arm64e 失败, 尝试只 arm64"; \
                 clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                   ${SHARED_CFLAGS} ${DYLIB_CFLAGS} \
                   -Wl,-undefined,dynamic_lookup ${DYLIB_LDFLAGS} \
                   -framework Foundation -framework UIKit \
                   -dynamiclib $SRCS -o "$OUT" \
                   && { strip -x "$OUT" && echo "strip OK"; } \
                   && echo "编译 OK (仅arm64)"; }
          file "$OUT"
          ldid -S "$OUT" && echo "ldid 签名 OK"

      # ---------- dylib 未定义符号审计（守 TrollStore：那里没有 substrate 可提供符号） ----------
      # dylib 用 -Wl,-undefined,dynamic_lookup 构建 → 链接期不报「找不到符号」，首次调用才崩。
      # 这里强制审计：绝不允许出现 substrate 类未定义符号。
      - name: Audit dylib undefined symbols (no substrate allowed)
        run: |
          OUT="${{ env.DYLIB_OUT }}"
          echo "===== 审计目标: ${OUT} ====="
          nm -u "$OUT" > /tmp/undef.txt 2>/dev/null || true
          echo "未定义符号行数: $(wc -l < /tmp/undef.txt)"
          echo "===== substrate 类符号（必须为空）====="
          SUBS=$(grep -E '_MSHook|_MSGetImageByName|_MSFindSymbol|_Substrate' /tmp/undef.txt || true)
          if [ -n "$SUBS" ]; then
            echo "::error::发现 substrate 未定义符号 —— TrollStore 无 substrate 可解析，首次调用即崩溃"
            echo "$SUBS"
            exit 1
          fi
          echo "OK: 无 substrate 未定义符号"
          echo "===== 前 15 个未定义符号（应均为 UIKit/Foundation/objc 系统符号）====="
          sort -u /tmp/undef.txt | head -15

      # ---------- arm64e 必须响亮：静默降级 arm64 会让大量 App 注入失败而 CI 却是绿的 ----------
      - name: Verify arm64e slice present (fail loudly, no silent downgrade)
        run: |
          OUT="${{ env.DYLIB_OUT }}"
          INFO=$(lipo -info "$OUT")
          echo "lipo: ${INFO}"
          if ! echo "$INFO" | grep -q 'arm64e'; then
            echo "::error::dylib 缺少 arm64e slice —— iOS 15/16 上大量 App 是 arm64e，注入会失败"
            exit 1
          fi
          echo "OK: arm64e slice 存在"

      # ---------- 产物挂到 Actions Artifacts（不打 tag 也能拿包装机测试） ----------
      # v1.0.78-fix2：此前全流没有 upload-artifact → run 页面没有下载入口；
      # 而不打 tag 时下面 Release 步骤又被 if 跳过 → 想装台测试机只能干等发版。
      # 这里把两形态产物挂到 run 页面底部「Artifacts」区（保留 90 天）。
      # 位置刻意放在所有审计之后：符号/切片/编译任一门禁不过就不挂，
      # 避免把不合格产物挂上去被人当正式包装。
      # 单文件路径上传，zip 内即文件名（deb 名含版本号；dylib 名含 tag 或 dev-短sha）。
      - name: Upload roothide deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pageturner-roothide-deb
          path: ${{ env.DEB_RAW }}
          if-no-file-found: error

      - name: Upload TrollStore dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: pageturner-trollstore-dylib
          path: ${{ env.DYLIB_OUT }}
          if-no-file-found: error

      # ---------- 发布 Release（仅 tag，版本号取自 tag） ----------
      - name: Publish Release (tag only, version from tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DEB_RAW="${{ env.DEB_RAW }}"
          DEB="PageTurner-${VERSION}-roothide.deb"
          cp "$DEB_RAW" "$DEB"
          DYLIB_RAW="${{ env.DYLIB_OUT }}"
          DYLIB="PageTurnerDylib_${TAG}.dylib"
          cp "$DYLIB_RAW" "$DYLIB"
          # 发布说明只取本版章节：RELEASE_NOTES.md 是累积式 changelog（含旧版本记录），
          # 只切到当前版本对应的「# PageTurner v<VERSION>」段，避免 Release 页面出现历史版本记录。
          awk -v ver="v${VERSION}" '
            /^# PageTurner v/ {
              if (capture && found) exit;                 # 已输出本版段、遇到下一个版本头 → 结束
              if ($0 ~ "# PageTurner " ver "$") { capture=1; found=1; print; next }
              else { capture=0; next }                   # 其他版本头：跳过
            }
            capture { print }                             # 本版段正文（含各级子标题/表格）透传
          ' RELEASE_NOTES.md > "notes-${VERSION}.md"
          NOTES="notes-${VERSION}.md"
          # 兜底：切出为空则用整篇（不应发生）
          [ -s "$NOTES" ] || cp RELEASE_NOTES.md "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" "$DYLIB" --clobber
          else
            gh release create "$TAG" "$DEB" "$DYLIB" --title "PageTurner v${VERSION}" --notes-file "$NOTES"
          fi
