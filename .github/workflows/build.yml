name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.37-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.37
          NOTES=$'PageTurner v1.0.37（roothide 直装）—— 滑动时序参数扩展：弹起停留 + 滑动分段\n\n【v1.0.37 改了什么】\n1. 滑动动作参数页新增「弹起停留 liftMs」（默认 0ms，0~500）：滑到终点后停 liftMs 再弹起（Ended），默认 0 = 原行为不变\n2. 滑动分段 steps 从写死的 12 段改为可调（默认 12，6~48）：段数只影响插值密度/轨迹平滑度，不影响总时长（总时长 = 距离÷速度）\n3. 参数页滑动四项：按下停留 / 弹起停留 / 滑动速度 / 滑动分段，每条滑动动作独立\n4. 测试区与运行端（番茄小说）行为完全一致；旧滑动动作无新字段自动走默认兼容\n\n【怎么测】\n1. 方案页 → 长按一条滑动动作 → 动作参数：看到 4 个滑块，调弹起停留（如 300ms）和滑动分段（如 24）\n2. 方案页测试：滑动到终点会停 300ms 再消失，轨迹更平滑\n3. 番茄小说实测：翻页器滑动映射按新时序执行；滑动动作独立参数互不影响\n4. 有问题把 /var/mobile/Documents/PageTurner.log 发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.37" --notes "$NOTES"
          fi
