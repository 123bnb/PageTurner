name: Build PageTurner

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 约束：同一版本（git ref / tag）同时只能有一个构建在跑；
# 同版本再次触发会取消较早的运行，保证“一个版本一个 Actions”。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45   # 注：GitHub 超时最小单位为 1 分钟；本构建需数分钟，设 45 兜底（deb + dylib 两包）
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency (control / Info.plist / Makefile)
        run: bash scripts/check_version.sh

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      # ---------- roothide deb ----------
      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "DEB_RAW=$DEB" >> "$GITHUB_ENV"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      # ---------- TrollStore / 巨魔 dylib（纯 clang + ldid，无 theos / 无 Logos / 无 ellekit） ----------
      # ---------- TrollStore / 巨魔 dylib（纯 clang + ldid，无 theos / 无 Logos / 无 ellekit） ----------
      - name: Build TrollStore dylib
        run: |
          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          mkdir -p out
          # v1.0.70：共享源文件列表 + 共享编译 flags 从 build/sources.mk 单一真源读取，
          # 不再在此手填（此前与 Makefile 的 PageTurner_FILES 两处维护，且已不一致）。
          SHARED_SRCS=$(make -s -f build/sources.mk PRINT_CONFIG=1 print-sources)
          SHARED_CFLAGS=$(make -s -f build/sources.mk PRINT_CONFIG=1 print-cflags)
          echo "共享源文件: ${SHARED_SRCS}"
          echo "共享 flags : ${SHARED_CFLAGS}"
          # dylib 私有：统一模板 common/PTOverlayPage.m + dylib 薄壳 targets/dylib/*
          SRCS="${SHARED_SRCS} common/PTOverlayPage.m targets/dylib/PTDylibMain.m targets/dylib/PTDylibUI.m"
          # 打 tag(v*) 用 tag 名，普通 push 用 dev-<短sha>
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then VER="${GITHUB_REF_NAME}"; else VER="dev-${GITHUB_SHA:0:7}"; fi
          OUT="out/PageTurnerDylib_${VER}.dylib"
          echo "DYLIB_OUT=$OUT" >> "$GITHUB_ENV"
          echo "输出产物: ${OUT}"
          # 先试 arm64+arm64e；arm64e 若失败则只 arm64
          clang -arch arm64 -arch arm64e -isysroot "$SDK" -miphoneos-version-min=15.0 \
            ${SHARED_CFLAGS} \
            -Wl,-undefined,dynamic_lookup \
            -framework Foundation -framework UIKit \
            -dynamiclib $SRCS -o "$OUT" \
            && echo "编译 OK (arm64+arm64e)" \
            || { echo "arm64+arm64e 失败, 尝试只 arm64"; \
                 clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                   ${SHARED_CFLAGS} \
                   -Wl,-undefined,dynamic_lookup \
                   -framework Foundation -framework UIKit \
                   -dynamiclib $SRCS -o "$OUT" \
                   && echo "编译 OK (仅arm64)"; }
          file "$OUT"
          ldid -S "$OUT" && echo "ldid 签名 OK"

      # ---------- dylib 未定义符号审计（守 TrollStore：那里没有 substrate 可提供符号） ----------
      # dylib 用 -Wl,-undefined,dynamic_lookup 构建 → 链接期不报「找不到符号」，首次调用才崩。
      # 这里强制审计：绝不允许出现 substrate 类未定义符号。
      - name: Audit dylib undefined symbols (no substrate allowed)
        run: |
          OUT="${{ env.DYLIB_OUT }}"
          echo "===== 审计目标: ${OUT} ====="
          nm -u "$OUT" > /tmp/undef.txt 2>/dev/null || true
          echo "未定义符号行数: $(wc -l < /tmp/undef.txt)"
          echo "===== substrate 类符号（必须为空）====="
          SUBS=$(grep -E '_MSHook|_MSGetImageByName|_MSFindSymbol|_Substrate' /tmp/undef.txt || true)
          if [ -n "$SUBS" ]; then
            echo "::error::发现 substrate 未定义符号 —— TrollStore 无 substrate 可解析，首次调用即崩溃"
            echo "$SUBS"
            exit 1
          fi
          echo "OK: 无 substrate 未定义符号"
          echo "===== 前 15 个未定义符号（应均为 UIKit/Foundation/objc 系统符号）====="
          sort -u /tmp/undef.txt | head -15

      # ---------- arm64e 必须响亮：静默降级 arm64 会让大量 App 注入失败而 CI 却是绿的 ----------
      - name: Verify arm64e slice present (fail loudly, no silent downgrade)
        run: |
          OUT="${{ env.DYLIB_OUT }}"
          INFO=$(lipo -info "$OUT")
          echo "lipo: ${INFO}"
          if ! echo "$INFO" | grep -q 'arm64e'; then
            echo "::error::dylib 缺少 arm64e slice —— iOS 15/16 上大量 App 是 arm64e，注入会失败"
            exit 1
          fi
          echo "OK: arm64e slice 存在"

      # ---------- 发布 Release（仅 tag，版本号取自 tag） ----------
      - name: Publish Release (tag only, version from tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DEB_RAW="${{ env.DEB_RAW }}"
          DEB="PageTurner-${VERSION}-roothide.deb"
          cp "$DEB_RAW" "$DEB"
          DYLIB_RAW="${{ env.DYLIB_OUT }}"
          DYLIB="PageTurnerDylib_${TAG}.dylib"
          cp "$DYLIB_RAW" "$DYLIB"
          # 发布说明只取本版章节：RELEASE_NOTES.md 是累积式 changelog（含旧版本记录），
          # 只切到当前版本对应的「# PageTurner v<VERSION>」段，避免 Release 页面出现历史版本记录。
          awk -v ver="v${VERSION}" '
            /^# PageTurner v/ {
              if (capture && found) exit;                 # 已输出本版段、遇到下一个版本头 → 结束
              if ($0 ~ "# PageTurner " ver "$") { capture=1; found=1; print; next }
              else { capture=0; next }                   # 其他版本头：跳过
            }
            capture { print }                             # 本版段正文（含各级子标题/表格）透传
          ' RELEASE_NOTES.md > "notes-${VERSION}.md"
          NOTES="notes-${VERSION}.md"
          # 兜底：切出为空则用整篇（不应发生）
          [ -s "$NOTES" ] || cp RELEASE_NOTES.md "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" "$DYLIB" --clobber
          else
            gh release create "$TAG" "$DEB" "$DYLIB" --title "PageTurner v${VERSION}" --notes-file "$NOTES"
          fi
