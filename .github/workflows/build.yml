name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.21-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.21
          NOTES=$'PageTurner v1.0.21（roothide 直装）—— 修复目标 App 不生效的终极根因（对照 volumekeytapper）\n\n【三个根因（全部来自对比 123bnb/volumekeytapper 私有仓库）】\n1. 【ellekit 拒载】dylib 纯手写 method_setImplementation，没有 %hook/_MSHookMessageEx 符号 → ellekit/roothide 拒绝注入第三方 App → 番茄小说根本没被注入（volumekeytapper 专门留空壳 %hook 生成符号）。修复：PTHook 改用 MSHookMessageEx（-lsubstrate 提供），符号表必含 _MSHookMessageEx\n2. 【跨沙盒读不到配置】固定路径 /var/mobile/Library/Preferences 在 roothide 下第三方 App 沙盒读不到 Preferences 进程写的全局配置 → enabledApps 判断永远失败 → 即使注入了也不 hook。修复：PTGlobalPlistPath() 多路径 + 从 dylib 镜像提取 .jbroot-XXX 根拼接真实路径（照抄 volumekeytapper VKTJbrootRoot/VKTGlobalPlistPath）\n3. 【注入无痕】无法取证。修复：constructor 无条件写注入标记 /var/mobile/Documents/PageTurner-injected-<bid>.txt，Filza 一眼判断注入成功与否\n\n【怎么测（按顺序排查）】\n1. 装 v1.0.21 → 注销\n2. Filza 打开 /var/mobile/Documents/ 看有没有 PageTurner-injected-com.dragon.read.txt（番茄小说）——没有 = 仍没注入（马上发我日志）；有 = 注入 OK\n3. 设置 → PageTurner → 总开关开 → 指定 App 勾番茄小说 → 打开番茄小说\n4. 按录过特征的键（如左键映射点击）：映射点击生效 = 成了；翻页器还能翻 = 未命中\n5. Filza 打开 /var/mobile/Documents/PageTurner.log 完整发我（启动两行 + 按键三段：addEvent 已学 sender → 会话结算 → 命中/未命中 → 执行）'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.21" --notes "$NOTES"
          fi
