name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.17-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.17
          NOTES=$'PageTurner v1.0.17（roothide 直装）—— 以真实 v1.0.4 为基底 + 日志系统\n\n【v1.0.17 改了什么】\n1. 整包回滚到【真实 v1.0.4】（release v1.0.4 = commit 0cd50018，用户实测唯一能正常录多个键、有位移数据的版本）。采集链路 = addEvent 拿 sender + 50ms 窗口 → sendEvent UITouch 屏幕坐标会话，位移/方向来自 UITouch 坐标增量\n2. 采集/结算/判重/阈值逐字未动（kDirTol=15 / kDistSlack=30 / kLearnMin=5 / kLearnMax=15 / kConverge=60）\n3. 只加日志系统：内存+文件双写（4 候选路径自动挑可写）；addEvent sender 变化 / sendEvent 窗口内 UITouch 事件 / 样本 / 判重 ACCEPT-REJECT 全打；调试日志页（首页新增）读内存日志 100% 可见 + 一键复制\n4. Tweak.xm 运行端 = 真实 v1.0.4 原版未动\n\n【怎么测（重点）】\n1. 装 v1.0.17 → 注销\n2. 设置 → PageTurner → 记录与映射 → 新增方案 → 进方案页 → 新增记录（大白屏）\n3. 关辅助触控，连续按翻页器同一个键（上/下/左/右/点击任选，多按几次）\n4. 返回 → 设置首页 → 调试日志 → 复制 → 完整发我\n5. 日志关键段：learn: armed=YES → addEvent: sender 变化 → sendEvent: phase/坐标 → end: dist/dir → judge: ACCEPT/REJECT'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.17" --notes "$NOTES"
          fi
