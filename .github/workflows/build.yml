name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.22-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.22
          NOTES=$'PageTurner v1.0.22（roothide 直装）—— 真正修复 ellekit 拒载：删除 dynamic_lookup，恢复 _MSHookMessageEx import\n\n【终极根因（本轮用 deb 拆包二进制级实证）】\n- Makefile 里 -Wl,-undefined,dynamic_lookup 会把 MSHookMessageEx 变成「运行时动态查找」符号，不写入 dylib 的 import 表\n- ellekit/roothide 扫描 dylib 时看不到 _MSHookMessageEx → 判定非 substrate 插件 → 拒载 → 番茄小说进程根本没被注入（/var/mobile/Documents/ 里没有 PageTurner-injected-com.dragon.read.txt 就是证据）\n- 二进制对比实证：TrollCM.dylib 含 _MSHookMessageEx 符号×4；PageTurner 之前 0 次（只剩日志字符串）\n- v1.0.21 用 extern 声明+调用 MSHookMessageEx 没用——符号被 dynamic_lookup 吞掉了\n\n【v1.0.22 改了什么】\n1. 删除 -Wl,-undefined,dynamic_lookup → MSHookMessageEx 正常 import libsubstrate → ellekit 认可注入\n2. 补 -framework IOKit（ptftouch 引用 IOHIDEvent* 5 个 C 函数，删除 dynamic_lookup 后需要显式链接）\n3. 保留：跨沙盒多路径读配置（jbroot 提取）、注入标记文件、命中才吞/未命中放行、会话通道\n\n【怎么测】\n1. 装 v1.0.22 → 注销\n2. Filza 打开 /var/mobile/Documents/ 看有没有 PageTurner-injected-com.dragon.read.txt —— 有 = 注入修复成功！没有 = 发我日志\n3. 设置 → PageTurner → 总开关开 → 指定 App 勾番茄小说 → 打开番茄小说按录过特征的键\n4. 映射点击生效 = 成；翻页器还能翻 = 未命中（发日志）\n5. /var/mobile/Documents/PageTurner.log 完整发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.22" --notes "$NOTES"
          fi
