name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.11-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.11
          NOTES=$'PageTurner v1.0.11（roothide 直装）—— 录制端全链路日志 + 会话彻底复位\n\n【v1.0.11 改了什么】\n1. 【录制端日志】设置 App 里录制时，全链路写 /var/mobile/Documents/PageTurner.log：hook 是否成功、每个事件的 sender/dx/dy、结算的 phase/dir/dist、判重拒绝时新旧特征对比 —— 录不到/重复录入一眼定位\n2. 【会话复位】学习页进入/退出时全量复位会话状态，防止"录一半退出 → 残留状态 → 下次录不进"\n3. 【判重提示】被拒时显示新旧特征详细对比（方向/位移/sender），确认是真重复还是误判\n4. 录制逻辑仍是 v1.0.4 原版（addEvent 0x23/0x24，无过滤无锚定），没动\n\n【怎么测】\n1. 装 v1.0.11 → 注销 → 重开设置\n2. 新建方案 → 新增记录 → 连续按同一个键（手指勿碰屏幕）直到稳定\n3. 再新增记录录第二个键 —— 如果又提示重复，看提示里的新旧特征对比\n4. 设置页 → 日志（复制）把内容发我，或直接发 /var/mobile/Documents/PageTurner.log'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release delete "$TAG" --yes || true
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.11" --notes "$NOTES"
          fi
