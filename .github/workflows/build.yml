name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.14-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.14
          NOTES=$'PageTurner v1.0.14（roothide 直装）—— 录制端双通道采集（根治"位移丢失+心跳污染"）\n\n【v1.0.14 改了什么】\n你的日志是铁证：录制时只有空闲心跳（dx=0 dy=0 每秒几十条）涌入 addEvent 层，方向键位移一个都没有 —— addEvent 层（HID 原始层）读不出方向键位移，所有键都收敛成"点击"，判重必然全拒；心跳还被当成"点击"录进方案（你截图 sender 全是心跳就是这个原因）。\n采集改双通道：\n1. addEvent 层只收位移事件（dx≠0）；dx=0 的心跳/点击一律跳过\n2. 新增 sendEvent 层（UIApplication -sendEvent:）：收翻页器合成触摸 —— UITouch 屏幕坐标增量=真实位移（运行端和画布都证明这层位移真实）；点击键坐标不变=点击；手指 sender=0 天然忽略；心跳不合成触摸，这层根本不存在\n3. 双通道 8ms 去重，同一按键只计一次\n4. 判重/结算/阈值不变\n\n【怎么测】\n1. 装 v1.0.14 → 注销 → 重开设置\n2. 新建方案 → 新增记录 → 连续按同一个键（如左键）直到稳定 → 命名保存\n3. 再新增记录录第二个键（如右键/上键）→ 这次应能录出独立特征\n4. 有问题把 设置 → PageTurner → 日志 → 复制 发我（日志标了 feed(addEvent)/feed(sendEvent) 来源，能看出哪个通道在工作）'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release delete "$TAG" --yes || true
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.14" --notes "$NOTES"
          fi
