name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.7-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.7
          NOTES=$'PageTurner v1.0.7（roothide 直装）—— 录制回归修复 + 设置图标标准尺寸\n\n【v1.0.7 改了什么】\n1. 【录制回归修复】v1.0.6 加了设备锚定（只录翻页器、不录手指），但进入学习页瞬间手指点按钮的触摸收尾事件会先到达，把锚定锁死成手指 sender，导致翻页器怎么按都没反应。修复：进入学习页延迟 1 秒再开始接收（跳过触摸收尾）；锁定后状态栏显示“已锁定设备 0x…”，按了没反应就返回重进学习页\n2. 【图标】设置图标从 87×87 改为标准 29×29（PreferenceLoader 的 icon 字段按 1x 渲染，87px 会被当成 87pt 显示所以一直偏大）\n3. 学习页状态提示细化：未锁定 / 已锁定但没样本（区分“没收到事件”和“锁错了”）\n\n【怎么测】\n1. 装 v1.0.7 → 注销\n2. 设置 → PageTurner → 确认图标与其他插件一样大\n3. 新建方案 → 新增记录 → 等 1 秒后只按翻页器键（手指勿碰屏幕）→ 应正常录制\n4. 录制正常后 → 开调试模式 → 打开生效 App → 按学过的键 → 看绿色大圆点是否出现'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release delete "$TAG" --yes || true
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.7" --notes "$NOTES"
          fi
