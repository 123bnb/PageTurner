name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.24-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.24
          NOTES=$'PageTurner v1.0.24（roothide 直装）—— 注入可视化：打开 App 一眼看出注入成功没\n\n【v1.0.24 改了什么（照抄 volumekeytapper）】\n1. 注入探针（抄 VKT ShowProbeAlert）：任何第三方 App 启动 2.5s 弹窗显示——本App / 注入✅成功 / 全局配置(文件可读?) / 总开关enabled / 注入测试crashTest / 勾选App数 / 本App被勾选。打开番茄小说一眼看出注入和勾选状态\n2. 注入提醒条（勾选生效 App 才有）：黑底白字+黄边框、屏幕中上方、2 秒——「PageTurner 注入成功 · 翻页键映射生效中」。打勾的 App 打开就有提醒条 = 注入成功\n\n【怎么测】\n1. 装 v1.0.24 → 注销\n2. 打开番茄小说（或任何第三方 App）→ 2.5 秒后弹「PageTurner 注入探针」：\n   - 弹了 = 插件注入成功（看 本App: com.dragon.read / 注入: ✅ 成功）\n   - 弹窗里看 本App被勾选: 是✅/否❌、总开关、勾选App数\n3. 勾选的 App 启动还有黄边框提醒条 = 生效确认\n4. 探针/提醒条都没有 = 注入还没发生，把 PageTurner.log 发我\n\n（上一版 v1.0.23 已修复终极根因：Filter 空 {} → 改为 Bundles com.apple.UIKit，ellekit 才会注入）'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.24" --notes "$NOTES"
          fi
