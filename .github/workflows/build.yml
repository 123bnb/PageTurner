name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.15-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.15
          NOTES=$'PageTurner v1.0.15（roothide 直装）—— 录制采集双通道修复（设置 App 内直接录 + 任意 App 都能录）\n\n【v1.0.15 改了什么】\n你说翻页器在系统设置里能操作（点击/左/右都响应）—— 这推翻了"设置 App 收不到事件"的判断，v1.0.14 没录上是采集代码 bug：\n1. 【方向键=hover】方向键（鼠标移动）合成的是 UIEventTypeHover（type=11），v1.0.14 只收 touches（type=0）→ 方向键全被过滤。现在 touches+hover 都收\n2. 【sender 溯源兜底】合成触摸读不到 sender 时，用最近 30ms addEvent 层收到的 sender 关联（点击键在 addEvent 层必有 type=11 sender）\n3. 【addEvent 层放开 type】所有 type 都读，位移从 0x23/24、0x04/05、0x3B/3C 多个候选字段取\n4. 【Tweak 全 App 学习采集】设置页学习页打开后，切到任意 App（番茄小说/备忘录）按翻页器也能录（sendEvent 层，运行端验证过的通道），样本写回设置页\n\n【怎么测】\n1. 装 v1.0.15 → 注销 → 重开设置 → PageTurner → 新建方案 → 新增记录\n2. 学习页里直接用翻页器按同一个键（如左键）多次，或切到任意 App 按完再回设置页\n3. 提示"特征已稳定"后命名保存；再录第二个键（右键/上键）\n4. 有问题：设置 → PageTurner → 日志 → 复制 发我（feed(addEvent)/feed(sendEvent) 标了来源）'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release delete "$TAG" --yes || true
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.15" --notes "$NOTES"
          fi
