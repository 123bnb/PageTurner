name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.27-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.27
          NOTES=$'PageTurner v1.0.27（roothide 直装）—— 触摸 sender 诊断：实测证明手指≠翻页器\n\n【v1.0.27 改了什么】\n1. 新增诊断日志：每个触摸会话 Began 打一行 [touch] sender=0x... phase=Began pos=(x,y)（手指、翻页器都记）\n2. 目的：方案 A（整段吞翻页器会话）的前置验证——用日志实测手指 sender 和翻页器 sender 是否不同，证明不会误吞手指\n\n【怎么测】\n1. 装 v1.0.27 → 注销 → 打开番茄小说（或其他 App）\n2. 用手指点屏幕 3 下（间隔 2 秒）\n3. 用翻页器按 3 次点击键、3 次方向键（间隔 2 秒）\n4. 把 /var/mobile/Documents/PageTurner.log 完整发我\n\n（v1.0.26 已修：总开关=总闸，探针/提醒条/调试可视化全纳入）'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.27" --notes "$NOTES"
          fi
