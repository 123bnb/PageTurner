name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.40-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.40
          NOTES=$'PageTurner v1.0.40（roothide 直装）—— 惯性修复：时间插值 + 静止衰减\n\n【v1.0.40 改了什么】\n1. 时间插值：滑动位置按真实经过时间算（帧间隔 max(16ms, 分段间隔)）\n   - 修：主线程忙时 Moved 事件忽快忽慢，App 看到的滑动速度不均匀\n2. 静止衰减：滑到终点（或回滑终点）后，每帧(~16ms)发一个位置不变的 Moved，持续 max(停顿,300)ms，再弹起\n   - 修：此前终点停下后不发任何事件，App 手势速度采样停在高速度上——\n     弹起停留 2000ms、回滑 10pt 都拦不住惯性（App 判定是快速甩动）\n   - 现在模拟真实手指停住：速度采样窗口被\"没动\"填满 → velocity=0 → 弹起无惯性\n3. 回滑（backPt）保留为第二道保险：回滑 N pt → 静止衰减 300ms+ → 弹起\n\n【怎么测】\n1. 方案页测试：滑动速度 2000 + 回滑距离 0 → 滑完页面停在目标位不再惯性前滑；轨迹速度均匀\n2. 回滑距离 2pt / 回滑停顿 80 → 回滑 + 静止衰减双保险，翻页不过头不回弹\n3. 番茄小说实测：速度 2000 滑动翻页 → 页面停在翻页后位置，不额外滚一段\n4. 有问题把 /var/mobile/Documents/PageTurner.log 发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.40" --notes "$NOTES"
          fi
