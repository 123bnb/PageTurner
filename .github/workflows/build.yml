name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.19-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.19
          NOTES=$'PageTurner v1.0.19（roothide 直装）—— 方案页测试区：大白屏测试页 + 绿点点触可视化\n\n【v1.0.19 改了什么】\n1. 方案页新增「▶ 测试本方案」入口 → 大白屏测试页\n2. 测试页按翻页器按键：完整特征匹配（sender+phase+方向±15°+dist 区间）→ 执行动作序列 → 大绿点可视化注入位置（点击原地显示；滑动起点→终点）\n3. 执行 = PTFakeMetaTouch（KIF 合成触摸，ptftouch 已编入设置页 bundle，与 volumekeytapper 同源）\n4. 在设置 App 内闭环验证"录特征→匹配→执行→点触"：绿点出现 = 执行链路 OK，无需去目标 App 实测\n5. 注入保护 gTestInjecting（防执行触摸被 hook 递归）、测试防抖 300ms\n\n【怎么测】\n1. 装 v1.0.19 → 注销\n2. 设置 → PageTurner → 记录与映射 → 进方案（如「左键」）\n3. 点最下方「▶ 测试本方案」→ 大白屏\n4. 按翻页器那个键（如左键）→ 看绿点是否出现在映射动作的坐标（如点击(200,600)绿点应在该位置闪一下）\n5. 绿点出现 = 匹配+执行+点触全部 OK；不出现 → 调试日志页复制日志发我'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.19" --notes "$NOTES"
          fi
