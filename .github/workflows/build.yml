name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.16-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.16
          NOTES=$'PageTurner v1.0.16（roothide 直装）—— 整包回滚 v1.0.4 + 日志系统\n\n【v1.0.16 说明】\n1. 按用户要求：整包回到 v1.0.4（用户实测唯一能正常录多个键、不冲突的版本），RootListController.m 采集/结算/判重/阈值（kDirTol=15 / kDistSlack=30 / kLearnMin=5 / kLearnMax=15 / kConverge=60）逐字等于 v1.0.4，一行采集逻辑未改\n2. 只新增日志系统：内存+文件双写（4 候选路径自动挑可写）；每个 addEvent 事件打印 type/sender/0x23/0x24/0x04/0x05/0x3B/0x3C/button（空闲心跳同 sender 1 秒折叠成 1 条防刷屏）；settle/judge/hook 状态全打；调试日志页改为直接读内存日志（100% 可见，不再依赖文件可写）\n3. Tweak.xm 运行端 = v1.0.4 原版未动（addEvent 层吞已学 sender）\n\n【怎么测（重点）】\n1. 装 v1.0.16 → 注销\n2. 设置 → PageTurner → 记录与映射 → 新增方案 → 进方案页 → 新增记录（大白屏）\n3. 关辅助触控，连续按翻页器同一个键（上/下/左/右/点击任选）\n4. 返回 → 设置首页 → 调试日志 → 复制 → 完整发我（这次是内存日志，必定有内容）\n5. 日志关键段：learn: viewDidLoad armed=YES → ev: type=11 sender=… 23/24=…（方向键应该有非零位移）→ settle: sender=… dist=… → judge: ACCEPT/REJECT'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.5" --notes "$NOTES"
          fi
