name: Build PageTurner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=PageTurner-1.0.42-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.42
          NOTES=$'PageTurner v1.0.42（roothide 直装）—— 调试日志总开关 + 日志上限\n\n【v1.0.42 改了什么】\n1. 【调试日志】总开关（设置→调试组，日志查看页上方，默认开）\n   - 开：记录注入/命中/执行全过程；关：完全无日志（内存/文件都不记）\n   - 开关下方写明位置与作用：内存保留最近 200 条，文件循环 1000 条\n2. 日志上限\n   - 内存日志（设置页调试日志页可见）：只存最近 200 条，超过循环\n   - 文件日志 /var/mobile/Documents/PageTurner.log：循环保留 1000 行，超过删最旧\n3. 开关控制所有日志：设置页内存+文件、运行端文件，全部受 debugLogEnabled 管控\n\n【怎么测】\n1. 设置→调试：看到【调试日志】开关（默认开）+ 下方说明文字；关掉后\n   录特征/测试不再产生任何日志（日志页空白、文件不增长）\n2. 打开日志开关，狂按测试：日志页最多显示 200 条；PageTurner.log 最多 1000 行\n3. 关闭开关重启番茄小说：PageTurner.log 不再增长，确认无日志落盘'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "PageTurner v1.0.42" --notes "$NOTES"
          fi
